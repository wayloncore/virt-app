# Virt's sounds from Kenney's free (CC0) packs. This repo's cloud sessions can't reach kenney.nl, but a runner can:
#   survey: downloads the packs and prints every sound's length, level, pitch and decay, plus spectrograms of the
#           likely bells, ticks and clicks (base64 between BEGIN-SHOT and END-SHOT, the same as the Mac run)
#   pick:   trims and levels the files scripts/sound-picks.json names into App/Sounds/virt-digital-*.caf (since Nov 27,
#           with one gain for the style so its loudest zero is at -1.5 dBFS, as `sounds.py louder` did), and commits
#           only those to the branch it ran on (the packs themselves are never kept)
# Start it with the dispatch (mode survey or pick), or with [sounds-survey] or [sounds-pick] in a pushed commit's
# message (a workflow only on a branch can't be dispatched yet).
# The Chime style is synthesized (scripts/sounds.py synth) and needs no download. Linux only: no Mac minutes.
name: Sounds
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "survey or pick"
        required: true
        default: "survey"
  push:
permissions:
  contents: write
jobs:
  sounds:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[sounds-survey]') || contains(github.event.head_commit.message, '[sounds-pick]')
    runs-on: ubuntu-latest
    env:
      MODE: ${{ github.event.inputs.mode || (contains(github.event.head_commit.message, '[sounds-pick]') && 'pick' || 'survey') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Tools
        run: |
          python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" -q install numpy==2.2.4 pillow==11.1.0 soundfile==0.13.1
      - name: Download the Kenney packs (CC0)
        run: |
          # kenney.nl refuses automated downloads (403 to a runner, Nov 17), so this doesn't use it. Kenney posts the
          # same CC0 packs on OpenGameArt, which allows direct downloads. A pack that can't be found is skipped; at
          # least one has to come down.
          mkdir -p "$RUNNER_TEMP/packs"; got=0
          for pack in interface-sounds ui-audio digital-audio; do
            page="https://opengameart.org/content/$pack"
            html=$(curl -fsSL "$page" 2>/dev/null) || { echo "::warning::$page: no answer"; continue; }
            zip=$(printf '%s' "$html" | grep -oE 'https://opengameart\.org/sites/default/files/[^"'"'"' <>]+\.zip' | head -1)
            [ -n "$zip" ] || { echo "::warning::$page: no .zip link"; continue; }
            echo "$pack: $zip"
            if curl -fsSL "$zip" -o "$RUNNER_TEMP/$pack.zip" && unzip -q -o "$RUNNER_TEMP/$pack.zip" -d "$RUNNER_TEMP/packs/$pack"; then
              got=$((got + 1))
              printf '%s' "$html" | grep -oiE 'CC0|Creative Commons Zero|public domain' | sort -u | sed "s/^/$pack license on the page: /"
            else
              echo "::warning::Couldn't download $pack"
            fi
          done
          [ $got -gt 0 ] || { echo "::error::No pack came down"; exit 1; }
      - name: Survey
        if: env.MODE == 'survey'
        run: |
          "$RUNNER_TEMP/venv/bin/python" -I scripts/sounds.py survey "$RUNNER_TEMP/packs" "$RUNNER_TEMP/shots"
          for f in "$RUNNER_TEMP"/shots/*.png; do echo "BEGIN-SHOT $(basename "$f")"; base64 -w 4000 "$f"; echo "END-SHOT"; done
      - name: Pick, level and commit the chosen files
        if: env.MODE == 'pick'
        run: |
          "$RUNNER_TEMP/venv/bin/python" -I scripts/sounds.py pick "$RUNNER_TEMP/packs" scripts/sound-picks.json App/Sounds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App/Sounds/virt-digital-*.caf
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -q -m "Sounds: the Digital style, picked from Kenney's CC0 packs (scripts/sound-picks.json)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
