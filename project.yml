# XcodeGen spec: the Mac workflow turns it into Virt.xcodeproj (the project file isn't kept in git).
name: Virt
options:
  bundleIdPrefix: com.tyleralocke
  deploymentTarget:
    iOS: "17.0"
packages:
  VirtCore:
    path: Core
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 6WK983RXJT
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: NO
targets:
  Virt:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["Sounds/LICENSES.md", "Bundle"]
      # Training's screens, embedded as they are (tyleralocke#822): a folder reference, so the files keep their
      # paths. scripts/fetch_bundle.py fills it before the project is generated; with only its .gitkeep there is no
      # bundle, and the app loads the website as before.
      - path: App/Bundle
        type: folder
        buildPhase: resources
        optional: true
      - Shared
    dependencies:
      - package: VirtCore
      - target: VirtTimer
    # the keychain group the app shares with its widgets (Shared/SharedStore.swift). The app's own id stays first, so
    # the sign-in copy (CookieKeeper) keeps going where it always has. No portal setup: App Store profiles allow the
    # team's own keychain groups.
    entitlements:
      path: App/Virt.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.tyleralocke.virt
          - $(AppIdentifierPrefix)com.tyleralocke.virt.shared
        # Training for friends (#578): Sign in with Apple. The App ID's capability is turned on by scripts/asc.py
        # (`ready`), so the App Store profile carries it.
        com.apple.developer.applesignin: [Default]
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # the home screen name (the build setting below says the same; "Virt timer" is the widget extension's own name)
        CFBundleDisplayName: Virt
        ITSAppUsesNonExemptEncryption: false
        # the Live Activity (the timer on the lock screen and in the Dynamic Island)
        NSSupportsLiveActivities: true
        # the workout timer's zero sound with the phone locked (App/BackgroundSound.swift): during a workout only, Virt
        # keeps running with a mixable audio session and plays each zero itself, with no notification banner
        UIBackgroundModes: [audio]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # pure black, no image: the launch clip (App/Intro.swift) starts from black
        UILaunchScreen:
          UIColorName: LaunchBlack
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        # kept for a page's photo picker (iOS offers Take Photo there, and needs this to open the camera); no page in
        # Virt asks for one today
        NSCameraUsageDescription: "Virt uses the camera only when you choose to take a photo."
        NSPhotoLibraryAddUsageDescription: "Virt saves a picture you share from Training to your photos only when you ask."
        # no Face ID key: Virt has no lock of its own (Nov 28). Sign in with Apple's sheet is Apple's and needs none.
        # virt://today (the widgets), virt://start, virt://rest?seconds=90, virt://settings
        CFBundleURLTypes:
          - CFBundleURLName: com.tyleralocke.virt
            CFBundleURLSchemes: [virt]
        # the web view is bound to the studio's domains (and train.time2play.live, the friends' Training) so Training's
        # service worker and the kinetic bridge run; the same list as VirtCore's Navigation.appBoundDomains
        # (DoorTests checks they match)
        WKAppBoundDomains:
          - tyleralocke.com
          - studio.tyleralocke.com
          - proud-unit-177a.cloudflareaccess.com
          - challenges.cloudflare.com
          - accounts.google.com
          - login.microsoftonline.com
          - appleid.apple.com
          - github.com
          - train.time2play.live
          # a scheme, not a domain (the colon says so to WebKit): Training's screens served from inside the app at
          # virt-app://train/ (tyleralocke#822). With it the list is at iOS's limit of ten.
          - "virt-app:"
        # touch and hold the Virt icon
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: com.tyleralocke.virt.start
            UIApplicationShortcutItemTitle: Start my workout
            UIApplicationShortcutItemIconSymbolName: figure.strengthtraining.traditional
          - UIApplicationShortcutItemType: com.tyleralocke.virt.rest
            UIApplicationShortcutItemTitle: Rest 90 seconds
            UIApplicationShortcutItemIconSymbolName: hourglass
          - UIApplicationShortcutItemType: com.tyleralocke.virt.settings
            UIApplicationShortcutItemTitle: Settings and tips
            UIApplicationShortcutItemIconSymbolName: gearshape
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tyleralocke.virt
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Virt
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      # Release is the signed App Store build (.github/workflows/testflight.yml). It signs by hand with the
      # distribution certificate and the two App Store profiles the workflow fetches (scripts/asc.py); VIRT_PROFILE is
      # the app's profile name, passed on the xcodebuild line. The simulator runs use Debug, unsigned.
      configs:
        Release:
          CODE_SIGNING_ALLOWED: YES
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: $(VIRT_PROFILE)
  VirtTimer:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    dependencies:
      - package: VirtCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: Widget/VirtTimer.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.tyleralocke.virt.shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Virt timer
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tyleralocke.virt.timer
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Virt timer
        SKIP_INSTALL: YES
      configs:
        Release:
          CODE_SIGNING_ALLOWED: YES
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: $(VIRT_TIMER_PROFILE)
  VirtUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Virt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tyleralocke.virt.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Virt
schemes:
  Virt:
    build:
      targets:
        Virt: all
        VirtUITests: [test]
    test:
      targets: [VirtUITests]
